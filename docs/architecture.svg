<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="654" viewBox="0 0 1140 654" role="img" aria-labelledby="title desc">
  <title id="title">Sites hosts the control panel; AWS runs the sender</title>
  <desc id="desc">The browser loads the private Sites interface. The Sites server relay forwards authenticated requests to the schedule manager, one Lambda in your AWS account. It creates an EventBridge timer. When due, that timer starts a separate LINE sender Lambda, which connects to LINE. Messages, results, the encrypted LINE session, and attachments persist in AWS storage. Storage access and login paths are described separately in the architecture guide.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#24645b"/></marker>
    <style>
      text{font-family:'Segoe UI',sans-serif;fill:#20352f}.title{font-family:Georgia,serif;font-size:30px}.tag{font-size:13px;letter-spacing:1.4px;font-weight:700;fill:#52675f}.name{font-size:23px;font-weight:650}.sub{font-size:17px;fill:#52675f}.verb{font-size:15px;fill:#24645b}.edge{fill:none;stroke:#24645b;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#8c9e96;stroke-width:1.5}.boundary{fill:none;stroke:#8c9e96;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1140" height="654" fill="#f8faf7"/>
  <text x="32" y="51" class="title">Sites hosts the control panel. AWS runs the sender.</text>
  <text x="32" y="81" class="sub">Hosting boundaries — read the scheduled-send figure for the order of events.</text>
  <text x="32" y="126" class="tag">YOUR DEVICE</text>
  <rect x="32" y="145" width="264" height="132" rx="4" class="box"/>
  <text x="52" y="182" class="name">Browser</text>
  <text x="52" y="215" class="sub">Compose and schedule;</text>
  <text x="52" y="241" class="sub">view progress and history.</text>
  <text x="400" y="126" class="tag">CHATGPT SITES · CLOUD</text>
  <rect x="400" y="145" width="304" height="132" rx="4" class="box"/>
  <text x="420" y="182" class="name">Private website</text>
  <text x="420" y="215" class="sub">Hosts the interface and</text>
  <text x="420" y="241" class="sub">an authenticated server relay.</text>
  <text x="840" y="126" class="tag">LINE · EXTERNAL SERVICE</text>
  <rect x="840" y="145" width="268" height="132" rx="4" class="box"/>
  <text x="860" y="182" class="name">Your LINE account</text>
  <text x="860" y="215" class="sub">Delivers messages to</text>
  <text x="860" y="241" class="sub">your existing chats.</text>
  <path d="M296 213H400" class="edge"/>
  <text x="308" y="190" class="verb">loads UI</text>
  <rect x="32" y="358" width="1076" height="264" rx="4" class="boundary"/>
  <text x="52" y="387" class="tag">YOUR AWS ACCOUNT</text>
  <path d="M552 277V316H204V421" class="edge"/>
  <text x="220" y="306" class="verb">relay forwards requests</text>
  <path d="M972 421V277" class="edge"/>
  <text x="984" y="326" class="verb">sends</text>
  <text x="984" y="348" class="verb">through LINE</text>
  <path d="M336 477H440M680 477H800" class="edge"/>
  <text x="351" y="456" class="verb">sets timer</text>
  <text x="694" y="456" class="verb">starts sender</text>
  <rect x="72" y="421" width="264" height="111" rx="4" class="box"/>
  <text x="92" y="454" class="name">Schedule manager</text>
  <text x="92" y="484" class="sub">API Lambda</text>
  <text x="92" y="511" class="sub">Schedules or cancels sends.</text>
  <rect x="440" y="421" width="240" height="111" rx="4" fill="#e6f1eb" stroke="#24645b" stroke-width="2"/>
  <text x="460" y="454" class="name">Send timer</text>
  <text x="460" y="484" class="sub">EventBridge Scheduler</text>
  <text x="460" y="511" class="sub">Waits until the due time.</text>
  <rect x="800" y="421" width="268" height="111" rx="4" class="box"/>
  <text x="820" y="454" class="name">LINE sender</text>
  <text x="820" y="484" class="sub">Worker Lambda + Go client</text>
  <text x="820" y="511" class="sub">Logs in and sends messages.</text>
  <path d="M72 557H1068" stroke="#cbd6cf"/>
  <text x="72" y="584" class="sub">Also stored in AWS: messages and results · encrypted LINE login · private attachments.</text>
  <text x="72" y="607" class="tag">STORAGE ACCESS AND LOGIN FLOWS ARE EXPLAINED SEPARATELY.</text>
</svg>
